{% extends "base.html" %}
{% block title %}Переместить оборудование{% endblock %}
{% block content %}
<h2>🚛 Переместить оборудование</h2>
<p>Вы можете отправить несколько позиций на одну локацию за раз.</p>
<form method="POST" id="moveForm">
    <div class="mb-3">
        <label for="destination" class="form-label">Локация (Куда)</label>
        <input type="text" class="form-control" id="destination" name="destination" required placeholder="Например: Поляна-Восток, Сцена, ДК Химик">
    </div>
    
    <div class="mb-3">
        <label class="form-label">Оборудование и количество</label>
        <div id="items-container">
            <div class="row mb-2 item-row">
                <div class="col-md-6">
                    <select class="form-select equipment-select" name="equipment[]" required>
                        <option value="">Выберите оборудование</option>
                        {% for name in equipment_names %}
                        <option value="{{ name }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <input type="number" class="form-control" name="quantity[]" placeholder="Количество" min="1" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-danger remove-row">✖</button>
                </div>
            </div>
        </div>
        <button type="button" id="add-row" class="btn btn-sm btn-secondary mt-2">+ Добавить ещё</button>
    </div>
    
    <div class="mb-3">
        <label for="responsible" class="form-label">Ответственный</label>
        <input type="text" class="form-control" id="responsible" name="responsible" placeholder="Кто выдаёт">
    </div>
    <div class="mb-3">
        <label for="comment" class="form-label">Комментарий</label>
        <input type="text" class="form-control" id="comment" name="comment" placeholder="Причина, заказ и т.п.">
    </div>
    
    <button type="submit" class="btn btn-primary">✅ Отправить</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Назад</a>
</form>

<script>
    // Динамическое добавление строк
    const container = document.getElementById('items-container');
    document.getElementById('add-row').addEventListener('click', function() {
        const firstRow = container.querySelector('.item-row');
        const newRow = firstRow.cloneNode(true);
        newRow.querySelectorAll('input, select').forEach(field => {
            if (field.tagName === 'SELECT') field.selectedIndex = 0;
            else field.value = '';
        });
        container.appendChild(newRow);
    });
    container.addEventListener('click', function(e) {
        if (e.target.classList.contains('remove-row')) {
            if (container.children.length > 1) {
                e.target.closest('.item-row').remove();
            } else {
                alert('Должна быть хотя бы одна позиция');
            }
        }
    });
    // Убедимся, что при отправке убираем пустые строки (если пользователь удалил выбор)
    document.getElementById('moveForm').addEventListener('submit', function(e) {
        let valid = true;
        document.querySelectorAll('.item-row').forEach(row => {
            const eq = row.querySelector('.equipment-select').value;
            const qty = row.querySelector('input[name="quantity[]"]').value;
            if (!eq || !qty) {
                valid = false;
                row.style.border = '1px solid red';
            } else {
                row.style.border = '';
            }
        });
        if (!valid) {
            e.preventDefault();
            alert('Заполните все поля (оборудование и количество)');
        }
    });
</script>
{% endblock %}
